name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smtms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Create test environment file
        run: |
          cat > .env << EOF
          APP_ENV=test
          APP_NAME=SMTMS-CI
          APP_DEBUG=true
          API_V1_STR=/api/v1
          SECRET_KEY=ci-test-secret-key-32-characters-long-xxx
          SMTMS_SEED_PASSWORD=ci-test-password-12345678
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          DATABASE_URL=mysql+pymysql://root:root@127.0.0.1:3306/smtms_test
          REDIS_URL=redis://127.0.0.1:6379/0
          CORS_ORIGINS=["http://localhost:5173"]
          DOCUMENT_STORAGE_DIR=var/documents
          DOCUMENT_MAX_FILE_BYTES=10485760
          EOF

      - name: Create document storage directory
        run: mkdir -p var/documents

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app/

      - name: Run database migrations
        run: uv run python -m alembic -c alembic.ini upgrade head

      - name: Run tests with pytest
        run: uv run pytest -q

      # Docker validation
      - name: Build backend Docker image
        run: docker build -t smtms-backend:ci .

      - name: Test backend Docker container
        run: |
          set -euo pipefail

          CONTAINER_NAME=smtms-backend-ci

          cleanup() {
            docker logs "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" || true
          }

          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --network host \
            --env-file .env \
            -v "$PWD/var/documents:/app/var/documents" \
            smtms-backend:ci

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "Docker container started successfully."
              docker rm -f "$CONTAINER_NAME"
              trap - EXIT
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo false)" != "true" ]; then
              echo "Docker container stopped unexpectedly."
              exit 1
            fi

            sleep 2
          done

          echo "Docker container health check timed out."
          exit 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with oxlint
        run: pnpm run lint

      - name: Run type check
        run: pnpm exec tsc --noEmit

      - name: Run tests with vitest
        run: pnpm test -- --run

      - name: Build production bundle
        run: pnpm run build
