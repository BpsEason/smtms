name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smtms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Create test environment file
        run: |
          cat > .env << EOF
          APP_ENV=test
          APP_NAME=SMTMS-CI
          APP_DEBUG=true
          API_V1_STR=/api/v1
          SECRET_KEY=ci-test-secret-key-32-characters-long-xxx
          SMTMS_SEED_PASSWORD=ci-test-password-12345678
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          DATABASE_URL=mysql+pymysql://root:root@127.0.0.1:3306/smtms_test
          REDIS_URL=redis://127.0.0.1:6379/0
          CORS_ORIGINS=["http://localhost:5173"]
          DOCUMENT_STORAGE_DIR=var/documents
          DOCUMENT_MAX_FILE_BYTES=10485760
          EOF

      - name: Create document storage directory
        run: mkdir -p var/documents

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app/

      - name: Run database migrations
        run: uv run python -m alembic -c alembic.ini upgrade head

      - name: Run tests with pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with oxlint
        run: pnpm run lint

      - name: Run type check
        run: pnpm exec tsc --noEmit

      - name: Run tests with vitest
        run: pnpm test -- --run

      - name: Build production bundle
        run: pnpm run build
