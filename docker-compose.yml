services:
  redis:
    image: redis:7-alpine
    container_name: smtms-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - smtms-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smtms-backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/var/documents:/app/var/documents
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smtms-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - smtms-net

  nginx:
    image: nginx:alpine
    container_name: smtms-nginx
    ports:
      - "8087:80"
    networks:
      - smtms-net

networks:
  smtms-net:
    driver: bridge
