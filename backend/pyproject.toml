[project]
name = "smtms-backend"
version = "0.1.0"
description = "FastAPI backend for SMTMS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "SQLAlchemy>=2.0.0,<3.0.0",
  "alembic>=1.14.0,<2.0.0",
  "PyMySQL>=1.1.0,<2.0.0",
  "redis>=5.0.0,<6.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "bcrypt>=4.1.2,<5.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "python-multipart>=0.0.9,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
exclude = [".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C4", "RUF"]
ignore = ["RUF012"]
allowed-confusables = ["，", "。", "！", "？", "：", "；", "「", "」", "『", "』", "（", "）", "【", "】", "／"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"